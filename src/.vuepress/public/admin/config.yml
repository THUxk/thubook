backend:
  name: git-gateway
  repo: THUxk/thubook
  branch: main
  base_url: https://yourschool.cc.cd/thubook/
  identity_url: https://api.yourschool.cc.cd/identity
  gateway_url: https://api.yourschool.cc.cd/git/github
  use_json_payload: true

  commit_messages:
    create: "CMS: 创建 {{collection}} {{slug}}"
    update: "CMS: 更新 {{collection}} {{slug}}"
    delete: "CMS: 删除 {{collection}} {{slug}}"
    uploadMedia: "CMS: 上传媒体文件 {{path}}"
    deleteMedia: "CMS: 删除媒体文件 {{path}}"

# local_backend: true  # 仅本地开发时启用，生产环境建议注释

site_url: https://yourschool.cc.cd/thubook/
display_url: https://yourschool.cc.cd/thubook/

# ⚠️ 重要：media_folder 指向 cms/ 子目录，而不是整个 src/assets
# 原因：Decap CMS 登录后会全量遍历 media_folder 下的所有文件，
# src/assets 下有 277 个历史图片（174MB），全量扫描会撞上后端 60次/分钟 的限速 → 429
# 改成 cms/ 后，CMS 默认只扫描这个几乎为空的目录，登录后请求数降到个位数。
# 历史图片用的是 <img src="../assets/xxx"> 相对路径，不走 CMS 媒体库，照常显示不受影响。
# 如果需要在 CMS 里复用某张老图，可以手动把那张图复制到 cms/ 下。
media_folder: "src/assets/cms"
public_folder: "/assets/cms"

collections:
  - name: "pages"
    label: "页面与文章"
    label_singular: "页面"
    folder: "src"
    create: true
    extension: .md
    format: frontmatter
    # 注意：Decap CMS 无法自动处理子目录 slug，建议让用户手动输入路径
    # 如果你希望支持子目录，请取消注释下面两行（但需用户输入完整路径）
    # path: "{{path}}"
    # slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "标题", name: "title", widget: "string", required: false }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", required: false, hint: "可选，用于排序" }
      - { label: "标签", name: "tags", widget: "list", default: [], required: false }
      - { label: "分类", name: "categories", widget: "list", default: [], required: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
        # 可选：若想将封面图单独存放，可取消下一行注释
        # media_folder: "src/assets/covers"
        # public_folder: "/assets/covers"
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false, hint: "设为 true 将不在网站显示（需 VuePress 支持）" }
      - { label: "内容", name: "body", widget: "markdown", required: true }